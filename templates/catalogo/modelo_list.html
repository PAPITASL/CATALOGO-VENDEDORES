{% extends 'catalogo/base.html' %}

{% block content %}
<h2>{{ title }}</h2>
<p><a href="{% url 'catalogo:modelovehiculo_create' %}">Nuevo modelo</a></p>
<table>
    <tr><th>Marca</th><th>Modelo</th><th>Activo</th><th>Acciones</th></tr>
    {% for object in objects %}
        <tr>
            <td>{{ object.marca.nombre }}</td><td>{{ object.nombre }}</td><td>{{ object.activo|yesno:'Sí,No' }}</td>
            <td><a href="{% url 'catalogo:modelovehiculo_update' object.pk %}">Editar</a> <a href="{% url 'catalogo:modelovehiculo_delete' object.pk %}">Eliminar</a></td>
        </tr>
    {% empty %}<tr><td colspan="4">No hay modelos.</td></tr>{% endfor %}
</table>
{% endblock %}
