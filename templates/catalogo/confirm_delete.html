{% extends 'catalogo/base.html' %}

{% block content %}
<section class="delete-page">
    <div class="delete-card">
        <div class="delete-icon" aria-hidden="true">!</div>
        <p class="eyebrow">ACCIÓN IRREVERSIBLE</p>
        <h2>{{ title|capfirst }}</h2>
        <p class="delete-question">¿Deseas eliminar este registro?</p>
        <div class="delete-object">{{ object }}</div>
        <p class="delete-hint">Esta acción no se puede deshacer. Verifica que sea el elemento correcto antes de continuar.</p>
        <form class="delete-actions" method="post">
            {% csrf_token %}
            <a class="button button-ghost" href="javascript:history.back()">Cancelar</a>
            <button class="button button-danger" type="submit">Confirmar eliminación</button>
        </form>
    </div>
</section>
{% endblock %}
